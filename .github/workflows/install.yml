name: GUI development package

on:
  push:
    branches: ["**"]
    paths: &build_paths
      - ".github/workflows/install.yml"
      - "agent/**"
      - "assets/interface.json"
      - "assets/resource/**"
      - "docs/GUI-Packaging.md"
      - "docs/Battle-Timeline.md"
      - "tests/test_*.py"
      - "tests/fixtures/**"
      - "install.py"
      - "requirements-dev.txt"
      - "README.md"
      - "LICENSE"
  pull_request:
    paths: *build_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build development package
        run: python install.py --version "0.0.0-ci.${{ github.run_number }}.${{ github.run_attempt }}"
      - name: Check packaged runtime and battle logic
        env:
          MAA_GUI_PACKAGE: install/MaaAssistPCR-win-x64
        run: python -m unittest discover -s tests
      - uses: actions/upload-artifact@v4
        with:
          name: MaaAssistPCR-win-x64-dev
          path: install/MaaAssistPCR-win-x64/
          if-no-files-found: error
          retention-days: 14
